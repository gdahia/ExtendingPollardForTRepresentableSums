name = "ExtendingPollardForTRepresentableSums"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ExtendingPollardForTRepresentableSums", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The proof development; `Solution.lean` imports it.
[[lean_lib]]
name = "ExtendingPollardForTRepresentableSums"

# The statement-only surface a reader audits.
[[lean_lib]]
name = "Challenge"
roots = ["ExtendingPollardForTRepresentableSumsPalomar.Challenge"]

# Proves the declarations stated in `Challenge.lean`; Comparator checks the two agree.
[[lean_lib]]
name = "Solution"
roots = ["ExtendingPollardForTRepresentableSumsPalomar.Solution"]
